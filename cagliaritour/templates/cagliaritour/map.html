{% extends 'cagliaritour/base.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
    <style>
        html, body, .container-fluid, main, .linkholder, .mapholder, #map {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrolling */
        }

        #routeInfobox.collapsed {
            display: none;
        }

        .position-absolute {
            z-index: 10; /* Ensures overlay buttons are clickable */
        }

        /* Styling for the modal dialog */
        #facialAnalysisDialog {
            display: none;
            position: fixed;
            z-index: 100;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 200px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
        }

        #facialAnalysisDialog img {
            width: 100px;
            height: 100px;
        }

        #facialAnalysisDialog .loading-bar {
            margin-top: 20px;
        }
    </style>

    <script>
        jQuery.noConflict();
// Function to start the camera and display the feed in the <video> element
function startCamera() {
    var video = document.getElementById('cameraFeed');

    // Access the camera and stream the video feed
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function (stream) {
                video.srcObject = stream;
                video.play();
            })
            .catch(function (error) {
                console.error("Error accessing camera: ", error);
                alert("Could not access the camera. Please check your browser settings.");
            });
    } else {
        alert("Camera not supported in this browser.");
    }
}

function generateDayButtons() {
    // Show the facial analysis dialog
    var dialog = document.getElementById("facialAnalysisDialog");
    var loadingBar = document.getElementById("loadingBar");
    var loadingText = document.getElementById("loadingText");

    // Reset progress bar and text
    loadingBar.style.width = '0%';
    loadingText.innerHTML = 'LOADING... 0%';

    dialog.style.display = 'block';

    // Start the camera feed
    startCamera();

    // Start the loading process
    var progress = 0;
    var intervalTime = 30; // Time for each increment (ms)
    var totalDuration = 3000; // Total duration (3 seconds)
    var increment = 100 / (totalDuration / intervalTime); // Increment percentage

    var interval = setInterval(function () {
        progress += increment; // Increment the progress

        if (progress >= 100) {
            progress = 100; // Ensure progress stops at 100%
        }

        // Update the width of the progress bar
        loadingBar.style.width = progress + '%';
        // Update the text to show percentage
        loadingText.innerHTML = 'LOADING... ' + Math.floor(progress) + '%';

        // Check if progress is 100 or more, and clear the interval
        if (progress >= 100) {
            clearInterval(interval); // Stop the interval
            setTimeout(function () {
                dialog.style.display = 'none'; // Hide the dialog after loading is complete
            }, 500); // Small delay before hiding
        }
    }, intervalTime); // Update every 30ms
}


    </script>

    <div class="container-fluid">
        <main>
            <div class="linkholder" style="width: 100%;">
                <div class="mapholder position-relative" style="width: 100%;">
                    <div id="map"></div>

                    <!-- Overlay Buttons -->
                    <div class="position-absolute top-0 start-0 mt-7 ms-7" style="padding: 10px;">
                        <div class="btn btn-light btn-lg button-with-image"
                             id="collapseButton" onclick="showForm(true)" style="width: 180px; height: 90px">
                            <b class="button-text">Get your <br/>Guide </b>
                            <div height="35" width="50">
                                <img src="{% static 'images/hand_image.png' %}" alt="Image" class="button-image">
                            </div>
                        </div>

                        <!-- Overlay Form -->
                        <form>
                            {% csrf_token %}
                            <div class="accordion-body collapse" id="form">
                                <div class="card" style="height: 460px; width: 350px; margin: 0">
                                    <button type="button" class="btn btn-light"
                                            id="hideFormButton" onclick="showForm(false)">
                                        <strong style="font-size: 20px;">Get Your Guide <i
                                                class="fas fa-angle-down"></i></strong>
                                    </button>
                                    <div class="card-body">
                                        <!-- Form fields -->
                                        <div class="form-group">
                                            <label for="id_departure_date">What is your departure day?</label>
                                            <input type="date" class="form-control" id="id_departure_date"
                                                   name="departure_date">
                                        </div>

                                        <div class="form-group">
                                            <label for="id_departure_time">What is your departure time?</label>
                                            <input type="time" class="form-control" id="id_departure_time"
                                                   name="departure_time">
                                        </div>

                                        <div class="form-group">
                                            <label for="id_moving_preference">How do you mainly prefer moving
                                                around?</label>
                                            <select class="form-control" id="id_moving_preference"
                                                    name="moving_preference">
                                                <option value="DRIVING">Driving</option>
                                                <option value="TRANSIT">Bus</option>
                                                <option value="WALKING">Walking</option>
                                                <option value="BICYCLING">Bicycling</option>
                                            </select>
                                        </div>

                                        <div class="form-group">
                                            <label for="id_main_interests">What are your main interests?</label>
                                            <select multiple class="form-control" id="id_main_interests"
                                                    name="main_interests[]">
                                                <option value="nature">Nature and Outdoor Activities</option>
                                                <option value="culture">Cultural Experiences</option>
                                                <option value="adventure">Adventure Sports</option>
                                                <option value="food">Food and Culinary</option>
                                                <option value="history">Historical Sites</option>
                                                <option value="shopping">Shopping</option>
                                                <option value="other">Other</option>
                                            </select>
                                        </div>

                                        <div class="form-group">
                                            <input type="checkbox" id="facialAnalysis" name="facialAnalysis">
                                            <label for="facialAnalysis">Facial Analysis</label>
                                        </div>

                                        <div class="form-group text-center mt-4 mb-4">
                                            <button type="button" class="btn btn-primary btn-lg"
                                                    onclick="generateDayButtons()">Start
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>

<!-- Facial Analysis Dialog -->
<div id="facialAnalysisDialog" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; height: 400px; background-color: white; border-radius: 15px; padding: 20px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2); text-align: center; overflow: hidden;">
    <p style="font-weight: bold; font-size: 20px;">Performing Facial Analysis</p>

    <!-- Video element for camera feed -->
    <div class="video-container" style="width: 100%; display: flex; justify-content: center; margin-bottom: 20px;">
        <video id="cameraFeed" autoplay style="width: 200px; height: 250px; border-radius: 10px; object-fit: cover;"></video>
    </div>

    <!-- Loading Bar with percentage -->
    <div class="loading-bar" style="margin-top: 20px;">
        <b id="loadingText" style="font-size: 18px;">LOADING... 0%</b>
        <div class="progress" style="height: 20px; margin-top: 10px; border-radius: 10px; background-color: #f0f0f0;">
            <div class="progress-bar" role="progressbar" style="width: 0%; background-color: #007bff; height: 100%; border-radius: 10px;" id="loadingBar"></div>
        </div>
    </div>
</div>



                    <!-- Div for displaying the Days Button -->
                    <div id="daysContainerDiv">
                    <div class="position-absolute top-0 start-50 translate-middle d-flex align-items-center justify-content-center btn-light"
                         id="daysContainer" style="padding: 20px; margin: 20px;">
                    </div>

                    </div>

                    <!-- Div for displaying route information -->
                    <div class="position-absolute bottom-0 left-0 btn-light" id="routeInfoContainer">
                        <div id="routeInfobox"
                             style="width: 500px; height: 400px; border: 2px solid black; border-radius: 20px; position: relative; overflow-y: auto;">
                        </div>
                    </div>

                    <!-- Clear route information button -->
                    <div class="position-absolute top-0 start-0 mt-7 ms-7" id="clear_button_Div" style="margin-top: 20px">
                        <button style="width: 180px; height: 50px; border-radius: 15px;" class="btn-light"
                                onclick="clearMap()">
                            <b style="font-size: 18px"><i class="fas fa-home"></i> Home </b>
                        </button>
                    </div>

                    <!-- Information button -->
                    <div class="position-absolute top-0 end-0 mt-7 me-7" style="padding: 10px;">
                        <button style="width: 300px; border-radius: 15px;" class="btn btn-light"
                                onclick="showWeatherCard()" id="collapseButtonInfo">
                            <b>Weather <i class="fas fa-angle-down"></i></b>
                        </button>
                        <div class="container bg-light" id="infoWindowBox"
                             style="height: 350px; width: 300px; border-radius: 15px; padding: 10px;">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script async
            src="https://maps.googleapis.com/maps/api/js?key={{ key }}&loading=async&callback=initMap">
    </script>

    <script id="dateandtime" src="{% static 'cagliaritour/date_time.js' %}"></script>
{% endblock %}
