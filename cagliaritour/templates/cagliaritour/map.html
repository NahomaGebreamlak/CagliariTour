{% extends 'cagliaritour/base.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
    <style>
        html, body, .container-fluid, main, .linkholder, .mapholder, #map {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrolling */
        }

        #routeInfobox.collapsed {
            display: none;
        }

        .position-absolute {
            z-index: 10; /* Ensures overlay buttons are clickable */
        }

        /* Styling for the modal dialog */
        #facialAnalysisDialog {
            display: none;
            position: fixed;
            z-index: 100;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 300px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
        }

        #facialAnalysisDialog img {
            width: 100px;
            height: 100px;
        }

        #facialAnalysisDialog .loading-bar {
            margin-top: 20px;
        }


        canvas {
            position: absolute;
        }

        /* Dialog Box Styling */
        #facialAnalysisDialog {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 450px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            overflow: hidden;
        }

        /* Video Container Styling */
        .canvaContainer {
            width: 250px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
            background-color: white; /* Background color to ensure consistency */
        }

        /* Fixed Size for Video */
        #video {
            width: 250px;
            height: 300px;
            object-fit: cover; /* Maintain aspect ratio while covering the area */
            max-width: 250px;
            max-height: 300px;
            min-width: 250px;
            min-height: 300px;
            background-color: black; /* Set background color for consistency */
        }

        /* Loading Bar Styling */
        .loading-bar {
            margin-top: 10px;
        }

        .progress {
            height: 20px;
            margin-top: 10px;
            border-radius: 10px;
            background-color: #f0f0f0;
        }

        .progress-bar {
            width: 0%;
            background-color: #007bff;
            height: 100%;
            border-radius: 10px;
        }

    </style>

    <script>
        // Define the width and height globally for reusability
        const VIDEO_WIDTH = 250;
        const VIDEO_HEIGHT = 300;

        jQuery.noConflict();

        function startVideoOnCall() {
            loadModelsAndStartVideo().then(() => {
                // Models and video loaded, now start face detection
            }).catch(error => {
                console.error("Error starting video:", error);
            });
        }

        function loadModelsAndStartVideo() {
            return new Promise((resolve, reject) => {
                showDialog();

                const models = [
                    faceapi.nets.tinyFaceDetector.loadFromUri("/static/models"),
                    faceapi.nets.faceLandmark68Net.loadFromUri("/static/models"),
                    faceapi.nets.faceRecognitionNet.loadFromUri("/static/models"),
                    faceapi.nets.faceExpressionNet.loadFromUri("/static/models"),
                    faceapi.nets.ageGenderNet.loadFromUri("/static/models")
                ];

                let loadedModels = 0;
                models.forEach((model) => {
                    model.then(() => {
                        loadedModels++;
                        updateLoadingBar(Math.floor((loadedModels / models.length) * 100));

                        if (loadedModels === models.length) {
                            startVideo().then(() => resolve()).catch(reject); // Resolve once video starts
                        }
                    }).catch(reject); // Handle any loading errors
                });
            });
        }

        function startVideo() {
            return new Promise((resolve, reject) => {
                const video = document.getElementById("video");
                if (!video) {
                    reject(new Error("Video element not found"));
                    return;
                }

                navigator.mediaDevices.getUserMedia({video: {}})
                    .then(stream => {
                        video.srcObject = stream;
                        video.onloadedmetadata = () => {
                            video.play();

                            // Ensure video has valid dimensions
                            video.onplaying = () => {
                                // Set video dimensions in JavaScript as well
                                video.width = VIDEO_WIDTH;
                                video.height = VIDEO_HEIGHT;

                                performFaceDetection(video, stream); // Start face detection once video is ready

                                // Start a 10-second timer to update loading bar again
                                let startTime = Date.now();
                                let loadingInterval = setInterval(() => {
                                    let elapsedTime = Date.now() - startTime;
                                    let percentage = Math.round((elapsedTime / 10000) * 100);

                                    if (percentage >= 100) {
                                        clearInterval(loadingInterval); // Stop interval after 10 seconds
                                        hideDialog(); // Hide the dialog after 10 seconds
                                        stopVideoStream(stream); // Stop video stream after detection is done
                                        generateDayButtons();
                                    } else {
                                        updateLoadingBar(percentage);
                                    }
                                }, 100);

                                resolve();  // Resolve the promise when video starts
                            };
                        };
                    })
                    .catch(err => reject(err));  // Reject in case of errors
            });
        }

        function stopVideoStream(stream) {
            stream.getTracks().forEach(track => track.stop()); // Stop all tracks to stop the camera
        }

        function performFaceDetection(video, stream) {
            const canvas = faceapi.createCanvasFromMedia(video);
            let container = document.querySelector(".canvaContainer");
            container.append(canvas);

            // Set canvas dimensions to match video
            canvas.width = 250;
            canvas.height = 300;

            const displaySize = {width: 250, height: 300};
            faceapi.matchDimensions(canvas, displaySize);

            // Custom draw options (to change the color)
            const drawOptions = {
                lineWidth: 3,
                drawLines: true,
                color: '#000000',  // Change to your desired color
            };

            // Perform face detection every 100ms
            setInterval(async () => {
                const detections = await faceapi
                    .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceExpressions()
                    .withAgeAndGender();

                if (detections) {
                    const resizedDetections = faceapi.resizeResults(detections, displaySize);
                    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);

                    // Draw face landmarks with custom color
                    faceapi.draw.drawFaceLandmarks(canvas, resizedDetections, drawOptions);

                    // Handle results if needed
                    if (resizedDetections) {
                        const age = resizedDetections.age;
                        const interpolatedAge = interpolateAgePredictions(age);
                        const gender = resizedDetections.gender;
                        const expressions = resizedDetections.expressions;
                        const maxValue = Math.max(...Object.values(expressions));
                        const emotion = Object.keys(expressions).filter(
                            item => expressions[item] === maxValue
                        );
                        // Display results (optional)
                    }
                }
            }, 100); // Adjust the interval as necessary
        }

        function interpolateAgePredictions(age) {
            // Your interpolation logic here
        }

        function showDialog() {
            document.getElementById("facialAnalysisDialog").style.display = "block";
        }

        function hideDialog() {
            document.getElementById("facialAnalysisDialog").style.display = "none";
        }

        function updateLoadingBar(percentage) {
            const loadingText = document.getElementById("loadingText");
            const loadingBar = document.getElementById("loadingBar");

            loadingText.innerText = `LOADING... ${percentage.toFixed(2)}%`;
            loadingBar.style.width = `${percentage}%`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Add event listeners or other setup tasks here
        });
    </script>

    <div class="container-fluid">
        <main>
            <div class="linkholder" style="width: 100%;">
                <div class="mapholder position-relative" style="width: 100%;">
                    <div id="map"></div>

                    <!-- Overlay Buttons -->
                    <div class="position-absolute top-0 start-0 mt-7 ms-7" style="padding: 10px;">
                        <div class="btn btn-light btn-lg button-with-image"
                             id="collapseButton" onclick="showForm(true)" style="width: 180px; height: 90px">
                            <b class="button-text">Get your <br/>Guide </b>
                            <div height="35" width="50">
                                <img src="{% static 'images/hand_image.png' %}" alt="Image" class="button-image">
                            </div>
                        </div>

                        <!-- Overlay Form -->
                        <form>
                            {% csrf_token %}
                            <div class="accordion-body collapse" id="form">
                                <div class="card" style="height: 300px; width: 350px; margin: 0">
                                    <button type="button" class="btn btn-light"
                                            id="hideFormButton" onclick="showForm(false)">
                                        <strong style="font-size: 20px;">Get Your Guide <i
                                                class="fas fa-angle-down"></i></strong>
                                    </button>
                                    <div class="card-body">
                                        <!-- Form fields -->
                                        <div class="form-group">
                                            <label for="id_departure_date">What is your departure day?</label>
                                            <input type="date" class="form-control" id="id_departure_date"
                                                   name="departure_date">
                                        </div>

                                        <div class="form-group">
                                            <label for="id_departure_time">What is your departure time?</label>
                                            <input type="time" class="form-control" id="id_departure_time"
                                                   name="departure_time">
                                        </div>

                                        <div class="form-group" style="display: none;">
                                            <label for="id_moving_preference">How do you mainly prefer moving
                                                around?</label>
                                            <select class="form-control" id="id_moving_preference"
                                                    name="moving_preference">
                                                <option value="DRIVING" selected>Driving</option>
                                                <option value="TRANSIT">Bus</option>
                                                <option value="WALKING">Walking</option>
                                                <option value="BICYCLING">Bicycling</option>
                                            </select>
                                        </div>


                                        <div class="form-group">
                                            <input type="checkbox" id="facialAnalysis" name="facialAnalysis">
                                            <label for="facialAnalysis">Facial Analysis</label>
                                        </div>

                                        <div class="form-group text-center mt-4 mb-4">
                                            <button type="button" class="btn btn-primary btn-lg"
                                                    onclick="startVideoOnCall()">Start
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Facial Analysis Dialog -->
                    <div id="facialAnalysisDialog"
                         style="display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; margin: 0 auto;">
                        <p style="font-weight: bold; font-size: 20px; text-align: center;">Performing Facial
                            Analysis</p>

                        <!-- Video Container -->
                        <div class="canvaContainer"
                             style="display: flex; justify-content: center; align-items: center; width: 100%;">
                            <video id="video" autoplay muted
                                   style="width: 100%; max-width: 350px; height: auto;"></video>
                        </div>

                        <!-- Loading Bar with Percentage -->
                        <div class="loading-bar" style="width: 100%; max-width: 300px; margin: 10px auto;">
                            <b id="loadingText" style="font-size: 18px;">LOADING... 65%</b>
                            <div class="progress"
                                 style="width: 100%; background-color: #f3f3f3; border-radius: 5px; overflow: hidden; height: 20px; margin-top: 10px;">
                                <div class="progress-bar" id="loadingBar"
                                     style="height: 100%; width: 65%; background-color: #4caf50; border-radius: 5px;"></div>
                            </div>
                        </div>
                    </div>


                    <!-- Div for displaying the Days Button -->
                    <div id="daysContainerDiv">
                        <div class="position-absolute top-0 start-50 translate-middle d-flex align-items-center justify-content-center btn-light"
                             id="daysContainer" style="padding: 20px; margin: 20px;">
                        </div>
                    </div>

                    <!-- Div for displaying route information -->
                    <div class="position-absolute bottom-0 left-0 btn-light" id="routeInfoContainer">
                        <div id="routeInfobox"
                             style="width: 500px; height: 400px; border: 2px solid black; border-radius: 20px; position: relative; overflow-y: auto;">
                        </div>
                    </div>

                    <!-- Clear route information button -->
                    <div class="position-absolute top-0 start-0 mt-7 ms-7" id="clear_button_Div"
                         style="margin-top: 20px">
                        <button style="width: 180px; height: 50px; border-radius: 15px;" class="btn-light"
                                onclick="clearMap()">
                            <b style="font-size: 18px"><i class="fas fa-home"></i> Home </b>
                        </button>
                    </div>

                    <!-- Information button -->
                    <div class="position-absolute top-0 end-0 mt-7 me-7" style="padding: 10px;">
                        <button style="width: 300px; border-radius: 15px;" class="btn btn-light"
                                onclick="showWeatherCard()" id="collapseButtonInfo">
                            <b>Weather <i class="fas fa-angle-down"></i></b>
                        </button>
                        <div class="container bg-light" id="infoWindowBox"
                             style="height: 350px; width: 300px; border-radius: 15px; padding: 10px;">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script async
            src="https://maps.googleapis.com/maps/api/js?key={{ key }}&loading=async&callback=initMap">
    </script>

    <script id="dateandtime" src="{% static 'cagliaritour/date_time.js' %}"></script>
{% endblock %}
